map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Normalizes the upstream scheme Fileglancer reports for a job (see
# $upscheme below) to a value proxy_pass can always dial. `map` is evaluated
# lazily, at proxy_pass time, so it still sees $upscheme after
# auth_request_set has populated it. This matters because the
# X-Fg-Upstream-Scheme header is missing entirely on Fileglancer builds that
# predate it -- an empty $upscheme would make proxy_pass target
# "://host:port", which nginx refuses outright (500 for every request).
# Falling back to http here is also the right choice on trust grounds: the
# scheme originates from a file the user's job wrote, so nothing here should
# depend on it being exactly "http" or "https".
map $upscheme $dial_scheme {
  default http;
  https   https;
}

# redirect all http traffic to https
server {
  listen 80 default_server;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen       443 ssl default_server http2;
  server_name  fileglancer.int.janelia.org fileglancer-dev.int.janelia.org;

  ssl_certificate           /etc/nginx/certs/default.crt;
  ssl_certificate_key       /etc/nginx/certs/default.key;

  root  /etc/nginx/html;

  # Check for maintenance mode - if maintenance.html exists in the server root
  # directory (e.g. /etc/nginx/html), serve it for all requests.
  location / {
    try_files /maintenance.html @normal;
  }

  location @normal {
    try_files $uri @proxy;
  }

  location @proxy {
    proxy_pass http://127.0.0.1:8989;

    proxy_redirect   off;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # websocket headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # pass all requests to /fc/files to the fileglancer central server.
  location /fc/files/ {
    try_files /maintenance.html @fc_files;
  }

  location @fc_files {
    rewrite ^/fc/files/(.*)$ /files/$1 break;
    proxy_pass http://127.0.0.1:8989;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }


  # pass all requests to /assets to the fileglancer assets files. This bypasses
  # the fileglancer server and serves the assets directly from the file system. It makes
  # it easier to find the assets and also reduces the load on fileglancer servers.

  location /assets/ {
    alias <path_to_fileglancer_assets>;
    # e.g. alias /opt/deploy/fileglancer-hub/.pixi/envs/default/lib/python3.13/site-packages/fileglancer/ui/assets/;
    # to locate this path, run:
    #  find /opt/deploy/fileglancer-hub/ -name "assets"
    autoindex off;
    expires max;
  }

  location /logo.svg {
    root <path_to_fileglancer_ui_directory>;
    # e.g. alias /opt/deploy/fileglancer-hub/.pixi/envs/default/lib/python3.13/site-packages/fileglancer/ui/;
    # to locate this path, run:
    #  find /opt/deploy/fileglancer-hub/ -name "ui"
    # it should point to the same directory as the fileglancer assets above, minus the "assets" subdirectory.
    try_files /logo.svg =404;
    autoindex off;
    expires max;
  }

  # Serve the statically-built Neuroglancer client. Its index.html references
  # assets with relative paths, so it must be served under a trailing-slash URL
  # for those paths to resolve to /neuroglancer/...
  location = /neuroglancer {
    return 301 /neuroglancer/;
  }

  location /neuroglancer/ {
    alias /opt/deploy/neuroglancer/dist/client/;
    index index.html;
    try_files $uri $uri/ =404;
    expires max;
  }

  # The app-service proxy's upstream-resolution endpoint. It is reachable only
  # from the auth_request subrequest in the service-proxy server block below,
  # never from a client, so it must not be served on the primary hostname.
  # See docs/ServiceProxy.md in the fileglancer repo.
  location = /api/apps/resolve { return 404; }

  # LEGACY: Redirect old /fg/ URLs to new root paths
  # This handles bookmarks and external links
  location /fg/ {
    rewrite ^/fg/(.*)$ /$1 permanent;
  }

  # LEGACY: Redirect exact /fg without trailing slash
  location = /fg {
    return 301 /;
  }

  error_page 404 /404.html;
    location = /40x.html {
  }

  error_page 500 502 503 504 /50x.html;
    location = /50x.html {
  }
}

# Per-job HTTPS subdomains for running app services (JupyterLab, marimo,
# OpenVSCode, TensorBoard, the noVNC desktop). A browser hits
# https://job-<id>-<mac>.services.int.janelia.org/ and nginx asks Fileglancer
# which compute node and port that job is serving on, then proxies straight
# there -- no proxied bytes pass through the application server, which matters
# because the desktop app is effectively a video stream.
#
# Requires, and does nothing without:
#   - a wildcard DNS record  *.services  IN A  <this host>
#   - a wildcard certificate for *.services.int.janelia.org (the existing
#     *.int.janelia.org cert does NOT cover it: a wildcard matches exactly one
#     label, and browsers enforce that strictly)
#   - apps.service_proxy_domain set in the Fileglancer config
#   - session_secret_key set too; the hostname labels are signed with it, and
#     Fileglancer refuses to start with a proxy domain and no key
#
# Documented in docs/ServiceProxy.md in the fileglancer repo. That file and this
# block have to change together.
server {
  listen       443 ssl http2;
  # The label carries a MAC over the job id, keyed by Fileglancer's
  # session_secret_key, so the subdomains cannot be enumerated. Matching the MAC
  # loosely here is fine -- Fileglancer verifies it -- but the shape has to
  # allow it, or every signed hostname falls through to the default server.
  server_name  ~^job-\d+-[a-z2-7]+\.services(-dev)?\.int\.janelia\.org$;

  ssl_certificate           /etc/nginx/certs/services-wildcard.crt;
  ssl_certificate_key       /etc/nginx/certs/services-wildcard.key;

  # Asks Fileglancer to map this Host header to a compute-node upstream. It
  # answers 204 with X-Fg-Upstream: <host>:<port> and, optionally,
  # X-Fg-Upstream-Scheme: http|https, or 403 to refuse. `internal` is
  # load-bearing: without it this endpoint is reachable from the network, and
  # it resolves any running service's host:port for whoever holds the signed
  # hostname.
  location = /_fg_resolve {
    internal;
    proxy_pass              http://127.0.0.1:8989/api/apps/resolve;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Host $host;
  }

  location / {
    auth_request     /_fg_resolve;
    auth_request_set $upstream $upstream_http_x_fg_upstream;
    auth_request_set $upscheme $upstream_http_x_fg_upstream_scheme;

    # Mandatory: nginx refuses to start when proxy_pass targets a variable and
    # no resolver is configured. Adjust to whatever this host actually runs.
    resolver 127.0.0.53 valid=30s;

    # The scheme comes from Fileglancer too, because some apps front themselves
    # with a TLS terminator (Caddy) and publish an https URL. Sending them a
    # plaintext request does not quietly lose encryption -- the app answers 400
    # -- so hardcoding http:// here breaks those apps outright.
    proxy_pass $dial_scheme://$upstream;

    # Those apps generate their own certificate on the compute node at launch,
    # signed by nobody, so there is nothing to verify against and nothing stable
    # to pin: the node and port change every launch. This is opportunistic
    # encryption -- it keeps the service token off the wire in cleartext and
    # authenticates nothing, which is no worse than the plaintext hop it
    # replaces. Leave proxy_ssl_name alone; its default is the proxy_pass host,
    # which is the name those certificates actually carry.
    proxy_ssl_verify      off;
    proxy_ssl_server_name on;

    # Passing $host through unchanged is what makes JupyterLab's WebSocket
    # origin check pass: the app then sees Host and Origin as the same value.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Long-lived WebSocket and streaming sessions: no buffering, generous read
    # timeout. The desktop and notebook apps hold connections open for hours.
    proxy_http_version 1.1;
    proxy_buffering    off;
    proxy_read_timeout 3600s;
  }

  # A refused resolution means the service is gone -- its job finished, was
  # cancelled, or has not published its address yet -- not that the user did
  # something wrong. Serve Fileglancer's explanation instead of nginx's stock
  # 403 page. The `=` lets the page carry its own 503.
  #
  # This catches only the 403 nginx generates for a denied auth_request;
  # proxy_intercept_errors is off by default, so a 403 from the app itself (a
  # JupyterLab token rejection, say) still reaches the browser unchanged. Do
  # not turn it on.
  #
  # A prefix location rather than a named one: nginx refuses a proxy_pass with
  # a URI part inside a named location. `internal` is why a client cannot
  # request the page directly, which keeps it out of the URL space apps see.
  error_page 403 = /_fg_unavailable;

  location = /_fg_unavailable {
    internal;
    proxy_pass       http://127.0.0.1:8989/api/apps/service-unavailable;
    proxy_set_header Host $host;
  }
}
